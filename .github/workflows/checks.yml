name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
        working-directory: pipeline
      - run: python -m pytest -m "not research"
        working-directory: pipeline
      - run: npm ci
        working-directory: web
      - run: npm test
        env:
          DOWNWIND_TEST_PYTHON: python
        working-directory: web
      - run: npx --no-install next typegen && npx --no-install tsc --noEmit
        working-directory: web
