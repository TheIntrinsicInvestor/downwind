name: Morning feed

on:
  schedule:
    - cron: "12 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downwind-morning-feed
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'TheIntrinsicInvestor/downwind' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DOWNWIND_DATA_DIR: /tmp/downwind-grids
      DOWNWIND_CHECK_DATA_DIR: /tmp/downwind-grids
      DOWNWIND_FORECAST_CACHE_DIR: /tmp/downwind-forecast
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/cache@v5
        with:
          path: /tmp/downwind-grids
          key: downwind-grids-${{ hashFiles('pipeline/dw/live.py', 'pipeline/dw/grids.py', 'pipeline/dw/config.py') }}
      - run: python -m pip install -r requirements.txt
        working-directory: pipeline
      - name: Restore detection archive
        shell: bash
        run: |
          set -euo pipefail
          # Detections from earlier mornings, so fire age and the 3-days-running rule see past the 7-day feed.
          if git ls-remote --exit-code --heads origin refs/heads/live-data > /dev/null; then
            git fetch --depth=1 origin refs/heads/live-data
            git show FETCH_HEAD:detections/archive.csv > "$RUNNER_TEMP/archive.csv" 2> /dev/null \
              || rm -f "$RUNNER_TEMP/archive.csv"
          fi
      - run: python -m dw.live --out "$RUNNER_TEMP/snapshot" --archive "$RUNNER_TEMP/archive.csv"
        working-directory: pipeline
      - name: Publish complete snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/snapshot"
          feed="$RUNNER_TEMP/feed"
          id=$(jq -er '.id | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-f0-9]{32}$"))' "$snapshot/manifest.json")
          day=$(jq -er '.date | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' "$snapshot/manifest.json")
          [[ "$id" == "$day-"* ]]

          git ls-remote --heads origin refs/heads/live-data > "$RUNNER_TEMP/live-ref"
          if [[ -s "$RUNNER_TEMP/live-ref" ]]; then
            git fetch origin refs/heads/live-data
            git worktree add --detach "$feed" FETCH_HEAD
          else
            git worktree add --orphan -b live-data "$feed"
          fi

          # Commit the three payloads and their manifest together. Keep earlier snapshots.
          mkdir -p "$feed/snapshots"
          mkdir "$feed/snapshots/$id"
          cp "$snapshot/$day.json" "$snapshot/$day.particles.bin.gz" "$snapshot/limits.json" "$feed/snapshots/$id/"
          cp "$snapshot/manifest.json" "$feed/manifest.json"
          mkdir -p "$feed/detections"
          cp "$RUNNER_TEMP/archive.csv" "$feed/detections/archive.csv"
          git -C "$feed" add -- manifest.json "snapshots/$id" detections/archive.csv
          git -C "$feed" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish Downwind snapshot for $day"
          commit=$(git -C "$feed" rev-parse HEAD)
          git push origin "$commit:refs/heads/live-data"
